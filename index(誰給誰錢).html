<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拆帳計算機</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .input-group input {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .input-group input[type="text"] {
            flex: 1;
        }

        .input-group input[type="number"] {
            width: 120px;
        }

        .btn-remove {
            background-color: #ff6b6b;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .btn-remove:hover {
            background-color: #ee5253;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button.btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button.btn:active {
            transform: scale(0.98);
        }

        .btn-add {
            background-color: #e8f4fd;
            color: #3498db;
        }

        .btn-add:hover {
            background-color: #d4eafc;
        }

        .btn-calc {
            background-color: #2ecc71;
            color: white;
        }

        .btn-calc:hover {
            background-color: #27ae60;
        }

        .summary {
            margin-top: 20px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #555;
        }

        .result-section {
            margin-top: 25px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }

        .result-section h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .result-list {
            list-style: none;
        }

        .result-item {
            background-color: #f1f9f5;
            border-left: 4px solid #2ecc71;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }

        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 拆帳計算機</h1>

    <div id="people-list">
        <!-- 人員輸入列會動態新增於此 -->
    </div>

    <div class="actions">
        <button class="btn btn-add" onclick="addPerson()">+ 新增成員</button>
        <button class="btn btn-calc" onclick="calculate()">開始計算</button>
    </div>

    <div class="summary" id="summary" style="display: none;">
        <span>總金額：<span id="total-amount">0</span> 元</span>
        <span>平均每人：<span id="avg-amount">0</span> 元</span>
    </div>

    <div class="result-section" id="result-section" style="display: none;">
        <h2>拆帳建議（誰給誰錢）：</h2>
        <ul class="result-list" id="result-list"></ul>
    </div>
</div>

<script>
    let defaultNames = ['A', 'B', 'C', 'D'];

    // 初始化預設 3 個人
    window.onload = function() {
        for (let i = 0; i < 3; i++) {
            addPerson(defaultNames[i] || `成員 ${i + 1}`);
        }
    };

    // 新增成員輸入框
    function addPerson(name = '') {
        const list = document.getElementById('people-list');
        const count = list.children.length;
        const personName = name || String.fromCharCode(65 + count);

        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <input type="text" class="person-name" value="${personName}" placeholder="姓名">
            <input type="number" class="person-pay" value="0" min="0" placeholder="支付金額">
            <button class="btn-remove" onclick="removePerson(this)">×</button>
        `;
        list.appendChild(div);
    }

    // 刪除成員輸入框
    function removePerson(btn) {
        const list = document.getElementById('people-list');
        if (list.children.length > 1) {
            btn.parentElement.remove();
        } else {
            alert('至少需要一位成員！');
        }
    }

    // 將原 C++ 邏輯轉譯為 JS 進行結算
    function calculate() {
        const nameInputs = document.querySelectorAll('.person-name');
        const payInputs = document.querySelectorAll('.person-pay');
        const n = nameInputs.length;

        let names = [];
        let pay = [];
        let total = 0;

        for (let i = 0; i < n; i++) {
            const name = nameInputs[i].value.trim() || `成員 ${i + 1}`;
            const amount = parseFloat(payInputs[i].value) || 0;
            names.push(name);
            pay.push(amount);
            total += amount;
        }

        const average = total / n;
        
        let money = [];
        for (let i = 0; i < n; i++) {
            money[i] = average - pay[i];
        }

        let results = [];

        while (true) {
            let max = -99999999;
            let min = 99999999;
            let giver = -1;
            let receptor = -1;

            for (let i = 0; i < n; i++) {
                if (money[i] > max && money[i] > 0.001) {
                    max = money[i];
                    giver = i;
                }
                if (money[i] < min && money[i] < -0.001) {
                    min = money[i];
                    receptor = i;
                }
            }

            if (giver === -1 || receptor === -1) {
                break;
            }

            let amountToTransfer = 0;

            if (max > (-min)) {
                amountToTransfer = -min;
                money[giver] = max + min;
                money[receptor] = 0;
            } else if (max < (-min)) {
                amountToTransfer = max;
                money[giver] = 0;
                money[receptor] = max + min;
            } else {
                amountToTransfer = max;
                money[giver] = 0;
                money[receptor] = 0;
            }

            results.push({
                from: names[giver],
                to: names[receptor],
                amount: amountToTransfer.toFixed(0)
            });

            let jump = 0;
            for (let i = 0; i < n; i++) {
                if (Math.abs(money[i]) < 0.001) {
                    jump++;
                }
            }
            if (jump === n) {
                break;
            }
        }

        // 渲染結果畫面
        document.getElementById('total-amount').innerText = total;
        document.getElementById('avg-amount').innerText = average.toFixed(1);
        document.getElementById('summary').style.display = 'flex';

        const resultList = document.getElementById('result-list');
        resultList.innerHTML = '';

        if (results.length === 0) {
            resultList.innerHTML = '<li class="result-item">大家都付得剛剛好，不需要給錢！</li>';
        } else {
            results.forEach(res => {
                const li = document.createElement('li');
                li.className = 'result-item';
                li.innerHTML = `
                    <span><strong>${res.from}</strong> 應給 <strong>${res.to}</strong></span>
                    <span class="highlight">$${res.amount} 元</span>
                `;
                resultList.appendChild(li);
            });
        }

        document.getElementById('result-section').style.display = 'block';
    }
</script>

</body>
</html>
